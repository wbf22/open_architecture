<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Explore Designs  Open Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="/">OpenArchitecture</a>
      <nav>
        <a href="/search.html">Explore</a>
        <a href="/upload.html" class="cta">Upload</a>
        <a href="/account.html">Account</a>
        <select class="theme-select" id="themeSelectSearch" aria-label="Theme selector">
          <option value="mint">Mint</option>
          <option value="sunset">Sunset</option>
          <option value="ocean">Ocean</option>
          <option value="paper">Paper</option>
        </select>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="search-hero">
      <h1>Find designs & architects</h1>
      <form class="search-form" id="searchForm">
        <input type="search" id="q" placeholder="search designs, architects, tags..." />
        <select id="type">
          <option value="all">All</option>
          <option value="design">Designs</option>
          <option value="architect">Architects</option>
        </select>
        <button class="btn btn-primary">Search</button>
      </form>
    </section>

    <section class="results">
      <div id="resultsGrid" class="grid"></div>
    </section>
  </main>

  <script src="/js/search.js"></script>
  <script>
    // sync theme controls across pages
    const sel = document.getElementById('themeSelectSearch')
    const saved = localStorage.getItem('oa.theme') || 'mint'
    document.documentElement.dataset.theme = saved
    if(sel) sel.value = saved
    sel?.addEventListener('change', e=>{
      const v = e.target.value
      document.documentElement.dataset.theme = v
      localStorage.setItem('oa.theme', v)
    })
  </script>
</body>
</html>
