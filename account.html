<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Account  Open Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="/">OpenArchitecture</a>
      <nav>
        <a href="/search.html">Explore</a>
        <a href="/upload.html" class="cta">Upload</a>
        <a href="/account.html">Account</a>
        <select class="theme-select" id="themeSelectAccount" aria-label="Theme selector">
          <option value="mint">Mint</option>
          <option value="sunset">Sunset</option>
          <option value="ocean">Ocean</option>
          <option value="paper">Paper</option>
        </select>
      </nav>
    </div>
  </header>

  <main class="container account-page">
    <aside class="account-sidebar">
      <div class="profile">
        <img src="/images/avatar.jpg" alt="Profile" />
        <h2>LinA M.</h2>
        <small>Portland, OR</small>
      </div>
      <nav>
        <a href="#">Profile</a>
        <a href="#">My designs</a>
        <a href="#">Settings</a>
        <a href="#">Billing</a>
      </nav>
    </aside>

    <section class="account-main">
      <h1>Your designs</h1>
      <div class="grid" id="myDesigns">
        <!-- user designs -->
      </div>
    </section>
  </main>

  <script src="/js/account.js"></script>
  <script>
    const sel = document.getElementById('themeSelectAccount')
    const saved = localStorage.getItem('oa.theme') || 'mint'
    document.documentElement.dataset.theme = saved
    if(sel) sel.value = saved
    sel?.addEventListener('change', e=>{
      const v = e.target.value
      document.documentElement.dataset.theme = v
      localStorage.setItem('oa.theme', v)
    })
  </script>
</body>
</html>
